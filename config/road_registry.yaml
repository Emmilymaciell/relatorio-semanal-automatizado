    primeira_semana_real: 2025-09-10
    formato_unifilar: "A0 paisagem"
    titulo_secao_4: "DIAGRAMA UNIFILAR"
    titulo_secao_5_1: "Dados climáticos do período:"      # única que diz "Dados"
    titulo_secao_8_1: "Não conformidades emitidas pelo Programa no período:"   # "pelo"
    titulo_secao_9: "RELATO DE INTERFERÊNCIA EM CAMPO"    # singular
    legenda_foto: "Relatório fotográfico RD-103"
    tem_tabela_bueiros: false
    # --- Fase 3.4 (v0.2), GF-1: ver nota equivalente em RD101 acima. 20/20
