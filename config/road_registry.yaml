    ambiental_modelo_licencas: C
    ambiental_conector_condicionantes: "neste período"   # única obra sem vírgula depois
    ambiental_condicionantes_preposicao_vencimento: "do"
    nc_grafico3_estilo_referencia: "a_seguir"   # forma própria da RD-103 ("O gráfico a seguir apresenta...")
    diario_anexo_com_virgula: true   # "...relatório, encontra-se anexo" (11/13, 85%, 4/4 no subconjunto v3) -- forma desta obra
    # TEXTO-01 (v0.3): esta obra emite a frase-ponte para o Gráfico 1.
    # Corpus, golden excluído: 22 com / 3 sem (scripts/24_levantar_frase_ponte_s3.py).
    s3_frase_ponte_grafico: true
    grafias_observadas:
      arquivo: "RO_NNN.1 - RD-103.{docx,pdf}"
      pasta_auxiliares: "Arquivos Auxiliares"   # única com A maiúsculo
    contrato_provenance:
      instrumento_convocacao:
