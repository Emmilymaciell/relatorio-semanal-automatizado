      ordem_servico:
        arquivo: "RD103\\2_Documentacao Licitatoria\\3_Contrato Executora\\documento-ficticio.pdf"
        trecho: "[trecho do documento-fonte omitido na versão pública]"
      ordem_servico_em:
        arquivo: "RD103\\2_Documentacao Licitatoria\\3_Contrato Executora\\documento-ficticio.pdf"
        valor: 2025-08-29
        trecho: "[trecho do documento-fonte omitido na versão pública]"
        metodo: "data da assinatura digital do PDF, não a data digitada no corpo"
        divergencia: "[detalhe omitido na versão pública]"
        confirmacao_cruzada: "[detalhe omitido na versão pública]"
        nota: "[detalhe omitido na versão pública]"
      contrato_assinado_em:
