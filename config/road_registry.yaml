    instrumento_convocacao: "02/2025"
    ordem_servico: "02/2025"
    ordem_servico_em: 2025-08-27
    ancora_semana_1: 2025-09-27
    primeira_semana_real: 2025-09-10
    formato_unifilar: "A3 paisagem"      # EXCEÇÃO: as outras 3 usam A0
    titulo_secao_4: "DIAGRAMA UNIFILAR"
    titulo_secao_5_1: "Condições climáticas do período:"
    titulo_secao_8_1: "Não conformidades emitidas pela Programa no período:"
    titulo_secao_9: "RELATO DE INTERFERÊNCIAS EM CAMPO"
    legenda_foto: "Relatório fotográfico RD-102A."
    tem_tabela_bueiros: false
    # --- Fase 3.4 (v0.2), GF-1: ver nota equivalente em RD101 acima. 20/20
    #     relatórios RD-102A legíveis (golden excluído) trazem esta data.
    diario_migracao_fisico_ate: 2026-04-20
    diario_migracao_digital_desde: 2026-04-21
    ambiental_modelo_licencas: B
    ambiental_conector_condicionantes: "no momento,"
    ambiental_condicionantes_preposicao_vencimento: "ao"   # única obra: "ao vencimento", não "do"
    nc_grafico3_estilo_referencia: "a_seguir"   # "O gráfico a seguir apresenta..." (21/32, 66%)
    diario_anexo_com_virgula: true   # "...relatório, encontra-se anexo" (8/14, maioria) -- única obra que diverge da RD-101/RD-104
    # TEXTO-01 (v0.3): esta obra NÃO emite a frase-ponte para o Gráfico 1.
    # Corpus, golden excluído: 6 com / 20 sem (scripts/24_levantar_frase_ponte_s3.py).
    s3_frase_ponte_grafico: false
    grafias_observadas:
      arquivo: "RO_NNN.1 - GO- 178A.{docx,pdf}"   # espaço após o hífen
    contrato_provenance:
      instrumento_convocacao:
        arquivo: "RD102A\\2_Documentacao Licitatoria\\3_Contrato Executora\\documento-ficticio.pdf"
        pagina: 1
        trecho: "[trecho do documento-fonte omitido na versão pública]"
      ordem_servico:
        arquivo: "RD102A\\2_Documentacao Licitatoria\\3_Contrato Executora\\documento-ficticio.pdf"
        trecho: "[trecho do documento-fonte omitido na versão pública]"
      ordem_servico_em:
        arquivo: "RD102A\\2_Documentacao Licitatoria\\3_Contrato Executora\\documento-ficticio.pdf"
        trecho: "[trecho do documento-fonte omitido na versão pública]"
      contrato_assinado_em:
        status: NOT_FOUND
        motivo: "bloco de assinatura do contrato não extraível do PDF; fica NOT_FOUND + HITL (detalhe omitido na versão pública)"

  RD103:
    pasta_sharepoint: RD103
    rodovia: "RD-103"
    rodovia_sem_hifen: "RD103"
    trecho: "Fim da Pavimentação/ ENTR. RD-202"   # FICTÍCIO (versão pública)
    trecho_extenso: "Fim da Pavimentação até ENTR. RD-202"
