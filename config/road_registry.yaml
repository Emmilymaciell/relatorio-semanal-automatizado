# CAMPOS AINDA DESCONHECIDOS (não descobertos nos documentos da amostra)
# =============================================================================
desconhecido:
  - "RD102A/RD103: data de assinatura do CONTRATO em si (instrumento_convocacao e
     ordem_servico/ordem_servico_em RESOLVIDOS em 2026-09-17, §7 -- ver
     contrato_provenance de cada obra). O PDF do contrato dessas duas obras não
     tem um bloco de assinatura textual extraível para o contrato propriamente
     dito (só para a Declaração de Negociação anexa); ver
     contrato_provenance.contrato_assinado_em.motivo em cada obra."
  - "RD102A: nome completo da empresa executora na capa (aparece truncado)."
  - "Municípios de cada obra — o campo TRECHO usa referências rodoviárias, não municípios."
