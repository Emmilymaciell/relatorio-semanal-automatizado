# =============================================================================
# road_registry.yaml — cadastro mestre por obra
#
# Contém os dados de CLASSE B: variam entre rodovias, mas não variam a cada
# semana. Extraídos e conferidos nas capas e nos termos de encerramento dos
# 8 relatórios da amostra (semanas 2026-08-22..08-28 e 2026-08-29..09-04).
#
# Confiança: CONFIRMADO para todos os campos marcados `fonte: capa` ou
# `fonte: termo_encerramento` — valor idêntico nos 2 relatórios da obra.
#
# ATENÇÃO: as grafias abaixo são as REAIS encontradas nos documentos, com as
# inconsistências preservadas de propósito (ver `grafias_observadas`). A
# padronização é decisão da Emmily — ver docs/mapeamento/14_perguntas_para_emmily.md
# =============================================================================

meta:
  versao: 1
  gerado_em: 2026-09-16
  base: amostra de 8 relatórios (regime vigente)
  regime_calendario: sabado_sexta        # válido a partir de 2026-01-03
  cidade_emissao: Cidade                # idêntica nas 4 obras
  contratante: Parceiro
  contrato_prog: "000/0000"               # contrato do Programa, citado na Apresentação

obras:

  RD101:
    pasta_sharepoint: RD101
    rodovia: "RD-101"                    # como aparece na capa
    rodovia_sem_hifen: "RD101"           # como aparece no termo de encerramento
    trecho: "MUNICÍPIO A / ENTR. RD-201 / 330"   # FICTÍCIO (versão pública)
    trecho_extenso: "Município A / Entr. Rd-201 / 330"
    extensao_km: 40.00
    extensao_texto: "40,00 km"
    codigo_sre: ["101ERD0120"]
    lote: "ÚNICO"
    empresa_executora_capa: "Executora A"
    empresa_executora_contrato: "Executora A"   # termo de encerramento
    empresa_executora_sigla: "EXA"       # usada na Apresentação
    empresa_supervisora: "Consórcio Supervisor A (Órgão Contratante)"
    contrato_obra: "001/2025"
    instrumento_convocacao: "01/2025"
    contrato_assinado_em: 2025-09-10
    ordem_servico: "01/2025"
    ordem_servico_em: 2025-09-19
    # --- numeração ---
    ancora_semana_1: 2025-10-04          # sábado projetado; nº = (inicio - ancora)/7 + 1
    primeira_semana_real: 2025-10-01     # regime 1, formato antigo
    # --- layout específico ---
    formato_unifilar: "A0 paisagem"
    titulo_secao_4: "UNIFILAR"
    titulo_secao_5_1: "Condições climáticas do período:"
    titulo_secao_8_1: "Não conformidades emitidas pela Programa no período:"
    titulo_secao_9: "RELATO DE RISCOS E INTERFERÊNCIAS EM CAMPO"
    legenda_foto: "Relatório fotográfico RD-101."
    tem_tabela_bueiros: true             # única obra com "Tabela 1 - Bueiros projetados"
    # --- Fase 3.4 (v0.2), GF-1: fatos por obra que a seção 7 (Diário de Obras)
    #     e a seção 6 (Ambiental) citam -- FATO, não redação (GUIA_DE_REDACAO.md
    #     §7): a migração do diário para digital NÃO ocorreu na mesma data nas
    #     4 obras. Levantado do corpus (output/extracao/texto/, golden
    #     excluído): 20/20 relatórios RD-101 legíveis trazem esta mesma data.
    diario_migracao_fisico_ate: 2026-04-24
    diario_migracao_digital_desde: 2026-04-25
    # a "frase de contagem de licenças" (seção 6) tem uma redação PRÓPRIA por
    # obra no corpus inteiro (31/31 relatórios RD-101, 100%) -- não é estilo
    # livre, é um modelo fixo por obra; ver config/textos_v3.yaml
    # s6_licencas_modelo_* para o texto de cada letra.
    ambiental_modelo_licencas: A
    # idem para o conector da frase das condicionantes (Figura 7): "no
    # momento," em 16/17 RD-101 (94%).
    ambiental_conector_condicionantes: "no momento,"
    ambiental_condicionantes_preposicao_vencimento: "do"
    nc_grafico3_estilo_referencia: "numero"   # "O Gráfico 3 apresenta..." (31/32, 97%)
    diario_anexo_com_virgula: false   # "...relatório encontra-se anexo" (9/14, maioria) -- ver s7_diario_anexo_* em textos_v3.yaml
    # TEXTO-01 (v0.3): esta obra emite a frase-ponte para o Gráfico 1.
    # Corpus, golden excluído: 23 com / 3 sem (scripts/24_levantar_frase_ponte_s3.py).
    s3_frase_ponte_grafico: true
    grafias_observadas:
      arquivo: "RO_NNN.1 - RD-101.{docx,pdf}"

  RD102A:
    pasta_sharepoint: RD102A
    rodovia: "RD-102 A"                  # capa grafa com espaço antes do A
    rodovia_sem_hifen: "RD102A"
    trecho: "Entr. BR-000 / Entr. RD-202"   # FICTÍCIO (versão pública)
    trecho_extenso: "Entr. BR-000/Entr. RD-202"
    extensao_km: 35.00
    extensao_texto: "35,00km"
    codigo_sre: ["102ERD0100", "102ERD0080"]
    lote: "A"
