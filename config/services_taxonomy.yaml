# REGRA DE SELEÇÃO — CONFIRMADO POR CRUZAMENTO DE FONTES (T-17, 2026-09-17)
# Uma aba vira subseção 5.2.x se, e somente se, `estado == "visible"` E tem ao
# menos uma foto (`celulas_com_imagem_na_celula` não vazio). Bate em 8/8 semanas
# e 4/4 obras, 33 pares, 0 divergências. Aba oculta nunca vira subseção; aba
# visível com 0 fotos também não (ex.: RD-103 nº 48/49, aba OAC visível/0 fotos).
# Comparar nomes de aba SEMPRE normalizados (sem acento, minúsculo, sem ponto
# final) — o nome varia em maiúsculas, acentos e ponto final entre semanas.
abas_relatorio_fotografico:
  CAPA: {classe: null, nota: "cabeçalho canônico; nº em AB2, período em AB4"}
  TERRAPLENAGEM: TERRAPLENAGEM
  Terraplenagem: TERRAPLENAGEM
  PAVIMENTAÇÃO: PAVIMENTACAO
