# -----------------------------------------------------------------------------
# PENDÊNCIAS ABERTAS DESTA TAXONOMIA
# -----------------------------------------------------------------------------
pendencias:
  T-17:
    status: RESOLVIDA
    resolvida_em: "2026-09-17"
    documento: docs/mapeamento/T17_P08_FECHAMENTO.md
    pergunta: "OAC e Obras Complementares não constam da legenda da Ficha de Campo,
               mas são subseções do relatório. Descobrir sob qual código são
               registrados."
    conclusao: |
      A pergunta partia de uma premissa errada: a legenda registrada aqui vinha
      só da RD-104. Resultado em três partes:

      (1) As subseções 5.2.x NÃO nascem da coluna Serviço da ficha. Nascem das
          ABAS VISÍVEIS E COM FOTO do RELATÓRIO FOTOGRÁFICO <nº>.xlsx, que por
          sua vez espelham os rótulos das pastas 3. Fotos\<AA-MM-DD>\<rótulo>\.
          Bate em 8/8 semanas, 4/4 obras, 33 pares aba↔subseção, 0 divergências.
          Aba oculta nunca vira subseção; aba visível com 0 fotos também não.
          → hipótese (c).

      (2) OAC ESTÁ na legenda da ficha (FICHA CAMPO!D19/F19) em RD-101, RD-102A
          e RD-103, e tem BLOCO DEDICADO nas 4 obras ("OAC (Bueiro Tubular) /
          OAE (Bueiro Celular/Passagem de Fauna)", colunas Escavação/Corpo/Ala/
          Compactação). Na RD-104, que não o tem na legenda, a atividade é
          lançada sob DRE (7/7 lançamentos). → hipótese (a) para a RD-104.

      (3) Obras Complementares NÃO existe na ficha, em nenhuma forma. É nome
          editorial do relatório para cerca/remoção de cerca/poste; na coluna
          Serviço é CER (RD-101/102A/103) ou TER (RD-104). → hipótese (d) para
          o nome, (a) para o lançamento.

      REGRA PARA A AUTOMAÇÃO: derivar 5.2.x das abas do Relatório Fotográfico,
      nunca do código de serviço da ficha (que é impreciso — ver
      `desvios_de_codificacao`). O título da subseção precisa de um mapa
      aba → título editorial por obra.
    confianca: CONFIRMADO POR CRUZAMENTO DE FONTES
  T-17b: "Não há regra descoberta que decida qual grafia o redator usa no título
          da subseção ('OAC' vs 'Obras de Arte Corrente'; 'Obras Complementares'
          vs 'Serviços Complementares'). Pode ser preferência do redator.
          Pergunta para a Emmily."
  T-18: "'Conservação do Trecho' tem 69 ocorrências em pasta de foto nas 4 obras e
         nunca virou subseção 5.2.x na amostra. Verificar no corpus histórico."
  T-19: "Confirmar se Detonação/Perfuração de rocha são registrados como TER."
