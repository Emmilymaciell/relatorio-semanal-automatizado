# =============================================================================
# services_taxonomy.yaml — taxonomia canônica de serviços e eventos
#
# Resolve P-06 e T-10. Aprovado pela Emmily: padronizar o vocabulário usando a
# forma mais completa, tecnicamente correta, formal e profissional.
#
# BASE DOCUMENTAL:
#   - legenda oficial da Ficha de Campo (colunas D/F, linhas 10–21), idêntica nas
#     4 obras → CONFIRMADO POR EVIDÊNCIA DIRETA
#   - 122 rótulos distintos levantados nas pastas `3. Fotos\<data>\<rótulo>\`
#     (output/inventarios/rotulos_pastas_fotos.json)
#   - abas do `RELATÓRIO FOTOGRÁFICO <nº>.xlsx`
#   - subseções 5.2.x dos 8 relatórios da amostra
#
# REGRA: `canonical_name` é o nome oficial a ser usado na automação futura.
# Os `aliases` são as grafias REAIS encontradas no acervo — servem para leitura,
# nunca para escrita.
# =============================================================================

meta:
  versao: 1
  gerado_em: 2026-09-16
  resolve: [P-06, T-10]
  confianca_legenda: CONFIRMADO POR EVIDÊNCIA DIRETA
  confianca_classificacao: FORTE INFERÊNCIA   # a classe de cada rótulo livre é inferida

# -----------------------------------------------------------------------------
# CLASSES — nem tudo que aparece como pasta de foto é serviço executado
# -----------------------------------------------------------------------------
classes:
  SERVICE:        Serviço de execução da obra. Entra nas subseções 5.2.x.
  QUALITY_CONTROL: Controle tecnológico — ensaios, laboratório, sondagem.
  SURVEY:         Topografia e levantamentos.
  ENVIRONMENTAL:  Meio ambiente. Alimenta a seção 6, não a 5.2.
  SST:            Segurança e Saúde no Trabalho. Alimenta a seção 6.
  MEETING:        Reunião. Gera anexo "Ata de Reunião", não subseção de serviço.
  OCCURRENCE:     Ocorrência/evento anormal. Alimenta as seções 8 e 9.
  ADMINISTRATIVE: Registro administrativo. Não entra no relatório.
  AMBIGUOUS:      Rótulo cuja classe não pôde ser determinada com segurança.

# -----------------------------------------------------------------------------
