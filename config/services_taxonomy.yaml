situacao:
  A:
    canonical_name: Em andamento
    descricao_ficha: "Em andamento"
  C:
    canonical_name: Concluído
    descricao_ficha: "Concluido"        # sem acento no original
  I:
    canonical_name: Impedido
    descricao_ficha: "Impedido (descrever impedimento)"
    exige_descricao: true

impedimentos_previstos:      # lista de exemplos da própria ficha (AK10:AK16)
  - Desapropriação
  - Rede de gás/esgoto/elétrica
  - Ausência de Licença
  - Ambiental

