# -----------------------------------------------------------------------------
# BLOCO OAC/OAE DEDICADO DA FICHA DE CAMPO — CONFIRMADO POR EVIDÊNCIA DIRETA
# Além da tabela de serviços lineares, a ficha tem uma SEGUNDA tabela, presente
# nas 4 obras, título literal:
#   "OAC (Bueiro Tubular) / OAE (Bueiro Celular/Passagem de Fauna)"
# Localização (varia por obra/semana): RD-101 B80/B89, RD-102A A80/B80,
#   RD-103 A67/B67, RD-104 A76/A77 + B76/B77.
# Colunas: Escavação | Corpo | Ala | Compactação | Observações, cada uma com
#   situação A / C / - por bueiro. Linhas: estaca, tipo (BSTC/BDCC/BSCC/BTTC/
#   BDTC/BTCC) e dimensão (Ø 0,60; 2,5x2,5; 3,0x3,0).
# → OAC NÃO é apenas um código da coluna Serviço: tem estrutura própria.
# -----------------------------------------------------------------------------
bloco_oac_ficha_de_campo:
  titulo: "OAC (Bueiro Tubular) / OAE (Bueiro Celular/Passagem de Fauna)"
  presente_em: [RD101, RD102A, RD103, RD104]
  etapas: [Escavação, Corpo, Ala, Compactação]
  tipos_de_bueiro: [BSTC, BDTC, BTTC, BSCC, BDCC, BTCC]
  confianca: CONFIRMADO POR EVIDÊNCIA DIRETA

# -----------------------------------------------------------------------------
# DESVIOS DE CODIFICAÇÃO — o código da coluna Serviço NÃO é confiável
# Fonte: 7 fichas diárias da RD-104, 22/08 a 28/08/2026, cruzamento Q x K.
# Evidência: output/evidencias/T17_P08_fichas_diarias_RD104_2026-08-22_2026-08-28.json
# -----------------------------------------------------------------------------
desvios_de_codificacao:
  RD104:
    - descricao: "Execução de OAC"
      codigo_lancado: DRE
      ocorrencias: 7
      nota: "a obra não tem OAC na legenda; lança a atividade em DRE"
    - descricao: "Execução de cerca / Execução de cercca / Remoção de cerca"
      codigo_lancado: TER
      ocorrencias: 5
      nota: "vira a subseção 'Obras Complementares' no relatório"
    - descricao: "Ensaio tecnológico"
      codigo_lancado: TER
      ocorrencias: 3
    - descricao: "Aplicação de polimero / Preparo de polimero"
      codigo_lancado: TER
      ocorrencias: 3
    - descricao: "Demolição da ponte existente"
      codigo_lancado: [TER, DRE]
      ocorrencias: 2
      nota: "mesmo serviço em dois códigos diferentes na mesma semana"
  regra: |
    NÃO derivar a subseção 5.2.x do código da coluna Serviço. A coluna é
    imprecisa e varia por obra. Derivar das abas do RELATÓRIO FOTOGRÁFICO.

