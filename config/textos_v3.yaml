    confirmado_em_relatorios: null
    fonte: "GUIA_DE_REDACAO.md §4.1"

  s2_legenda_figura1:
    classe: A
    template: "Figura {n} – Ficha de andamento físico da obra"
    confirmado_em_relatorios: null
    fonte: >-
      docs/mapeamento/04_layout_visual.md §5.2/§9.1 — RD101 nº47 (RO_047.1 -
      RD-101, fora do golden desta comparação, RO_049.1 - RD-103); única
      legenda do documento com campo SEQ do Word, ou seja, a forma "oficial"
      de referência. Fase 3.3 Sec.3.1: fecha a lacuna do Checkpoint 3.2B
      (sequência de Figura não pode começar em 2).

  s3_legenda_grafico1:
    classe: A
    template: "Gráfico {n} – Avanço global da obra."
    confirmado_em_relatorios: null
    fonte: "docs/mapeamento/04_layout_visual.md §9.1 — RD101 nº47 (RO_047.1 - RD-101)"

  s5_1_legenda_tabela1:
    classe: A
    template: "Tabela {n} - Condições climáticas no período"
    confirmado_em_relatorios: null
    fonte: >-
      docs/mapeamento/04_layout_visual.md §9.1 (forma predominante em
      RD-103/RD-104); docs/mapeamento/06_fontes_dados.md (RO_047.1 - RD-101).
