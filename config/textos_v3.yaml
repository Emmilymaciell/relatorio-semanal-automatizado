  s3_avanco_texto:
    classe: TPL
    template: "Avanço físico global do período: {concluido} concluído; {concluido_atacado} concluído e atacado."
    confirmado_em_relatorios: null
    nota: >
      Rótulo factual minimalista para os dois números de avanço (spec Sec.5:
      "avanço (número, não figura)") — não é prosa narrativa reconstruída,
      só os valores computados com um rótulo; por isso não exige citação de
