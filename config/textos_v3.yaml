  s4_unifilar_texto_base:
    classe: A
    template: >-
      O Diagrama Unifilar apresentado em anexo representa, de forma simplificada, o avanço
      físico acumulado da execução da Rodovia {rodovia}, indicando a progressão das
      frentes de serviço ao longo do trecho contratual. Esse instrumento permite visualizar,
      em um traçado linear, os segmentos concluídos, em execução e previstos, servindo como
      referência para o acompanhamento mensal e para a verificação da conformidade entre o
      avanço planejado e o efetivamente executado.
    confirmado_em_relatorios: null
    fonte: "GUIA_DE_REDACAO.md §4.2 — idêntico nas 4 obras (\"manter\"); TEXTOS_E_TEMPLATES.md §2.2"

  s4_unifilar_frase_servicos:
    classe: [C, TPL]
    template: "No intervalo considerado, foram registradas atividades de {lista_de_servicos}."
    confirmado_em_relatorios: 135
    fonte: "mesmo template de s1_periodo_servicos; GUIA_DE_REDACAO.md §4.2 padroniza a forma da RD-103 para esta"

  s5_1_abertura_tabela:
    classe: A
    texto: "Segue abaixo as condições climáticas referente ao período do presente relatório:"
