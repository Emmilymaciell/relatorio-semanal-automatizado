    fonte: "TEXTOS_E_TEMPLATES.md §2.1 — 129 relatórios (100%), golden subtraído"

  s5_1_frase_sem_execucao_um_dia:
    classe: [C, TPL]
    template: "No dia {data} não houve execução de atividades."
    confirmado_em_relatorios: null
    fonte: "GUIA_DE_REDACAO.md §4.3; docs/mapeamento/T13_CLIMA_DIA_SEM_FICHA.md"

  s5_1_frase_sem_execucao_varios_dias:
    classe: [C, TPL]
    template: "Nos dias {datas} não houve execução de atividades."
    confirmado_em_relatorios: null
    fonte: "GUIA_DE_REDACAO.md §4.3"

  s5_2_intro:
    classe: A
    texto: >-
      O relatório fotográfico demonstra de forma visual as informações relevantes das
      atividades desenvolvidas ao longo do trecho.
    confirmado_em_relatorios: 122
    fonte: "TEXTOS_E_TEMPLATES.md §2.1 — 123 relatórios (75,0%), golden subtraído"

  s5_2_legenda_foto:
    classe: TPL
    template: "Figura {n} – Relatório fotográfico – {servico_canonico} – {rodovia}."
    confirmado_em_relatorios: 0
    fonte: "GUIA_DE_REDACAO.md §4.4 (R-11) — forma-alvo da padronização; hoje há 3 padrões distintos no acervo, nenhum majoritário nesta forma unificada"

  s6_texto_com_numero:
    classe: [E, TPL]
    template: >-
      A gestão e o rastreamento das licenças e outorgas [de uso de recursos hídricos —
      trecho truncado no corpus], bem como o status das condicionantes ambientais da
