# =============================================================================
# textos_v3.yaml — catálogo de textos fixos e templates da estrutura CURRENT (v3)
#
# Resolve a "regra de origem" da spec Fase 3 Slice 3, Sec.5:
#   1. Todo texto fixo/template aqui é DERIVADO do corpus da descoberta
#      (docs/mapeamento/TEXTOS_E_TEMPLATES.md e docs/mapeamento/GUIA_DE_REDACAO.md),
#      EXCLUINDO o relatório golden desta comparação (RO_049.1 - RD-103).
#   2. Cada entrada registra `confirmado_em_relatorios`: a contagem publicada em
#      TEXTOS_E_TEMPLATES.md, com 1 subtraído por precaução onde o golden pode
#      integrar o corpus de 189 relatórios (RO_049.1 foi emitido em 2026-09-11,
#      dentro da janela coberta pelo corpus de 2026-09-17) — nunca inflado.
#      Onde a forma é a PADRONIZAÇÃO alvo do GUIA_DE_REDACAO (ainda não
#      majoritária no acervo), `confirmado_em_relatorios: 0` e a nota registra
#      isso explicitamente — não é um texto "visto muitas vezes", é uma correção.
#   3. NENHUM valor específico do período (data, número, percentual, estaca,
#      NC, serviço, contagem, nº de páginas) mora aqui — isso vem sempre de
#      report_data.json. Este arquivo só guarda a FORMA da frase.
#   4. `assert_nao_e_golden()` (scripts/gerador/__init__.py) segue valendo em
#      tempo de execução: nada aqui foi lido do RO_049.1 - RD-103.docx/.pdf.
#
# Placeholders entre chaves ({data_inicio}, {servico}, ...) são substituídos
# pelo content_builder.py — nunca aqui.
# =============================================================================

meta:
  versao: 1
  gerado_em: 2026-09-17
  fonte_primaria: [docs/mapeamento/TEXTOS_E_TEMPLATES.md, docs/mapeamento/GUIA_DE_REDACAO.md,
                    docs/mapeamento/PADRAO_ATUAL_RELATORIO_SEMANAL.md]
  golden_excluido: "RO_049.1 - RD-103 (RD103, 2026-08-29..2026-09-04)"
  regra_de_contagem: >
    confirmado_em_relatorios = contagem publicada em TEXTOS_E_TEMPLATES.md § 2,
    menos 1 quando o golden desta comparação plausivelmente integra o universo
    de 189 relatórios do corpus (emitido 2026-09-11, dentro da janela do
    corpus). Textos que são a FORMA-ALVO da padronização do GUIA_DE_REDACAO
    (ainda não majoritária no acervo bruto) ficam com confirmado_em_relatorios: 0
    e nota explícita — não inventam frequência que não existe.

textos:

  capa_titulo:
    classe: A
    texto: "RELATÓRIO SEMANAL DE ACOMPANHAMENTO DE OBRAS"
    confirmado_em_relatorios: null
    nota: "título fixo da capa; classe A, sem variação observada na amostra (report_schema.yaml capa.titulo)"

  s1_contratual:
    classe: A
    template: >-
      O presente relatório de avanço semanal das obras da rodovia {rodovia},
      trecho: {trecho_extenso}, extensão: {extensao} é parte integrante das
      obrigações do contrato {contrato_prog}, do CONSÓRCIO DE APOIO À
      ESTRUTURAÇÃO DE PROJETOS – Programa, cujo objeto é a prestação de serviços
      relacionados à gestão e certificação de projetos e obras de infraestrutura
      e demais serviços, nos termos do Chamamento Público para Pré-Qualificação
      nº 01/2024-Órgão Supervisor e em conformidade com o escopo estabelecido no Termo de
      Referência para o Programa de Gestão de Obras no âmbito do Fundo Estadual
      de Infraestrutura ‐ Fundo Estadual de Infraestrutura, promovido pelo INSTITUTO PARA
      PARCEIRO – Parceiro.
    confirmado_em_relatorios: 158
    fonte: >-
      levantado do corpus por scripts/17_levantar_texto_s1.py sobre
      output/extracao/texto/, com o golden RD103_RO049.1 EXCLUÍDO.
      158 de 187 relatórios com a seção 1 legível trazem este parágrafo.
    variantes_observadas: >-
      duas redações no acervo: 76 ocorrências com "extensão: {X} é parte
      integrante das obrigações do contrato" e 82 com "extensão: {X} e é parte
      integrante das obrigações, do contrato". A segunda tem um "e" solto e uma
      vírgula indevida entre "obrigações" e "do contrato". Adotada a primeira,
      gramaticalmente correta — padronizar FORMA, nunca FATO (GUIA_DE_REDACAO).
      A ocorrência de "Pré- Qualificação" nas contagens é quebra de linha do PDF,
      não variante real.
    nota: >-
      classe A (texto fixo do processo). Na primeira geração desta seção o texto
      ficou como LIMITATION porque TEXTOS_E_TEMPLATES.md não citava o literal;
      ele existe no corpus extraído e foi levantado de lá, não do golden.

  s1_periodo_servicos:
    classe: [C, TPL]
    template: >-
      As informações apresentadas neste relatório referem-se ao período de
      {data_inicio} a {data_fim}. No intervalo considerado, foram registradas
      atividades de {lista_de_servicos}.
    confirmado_em_relatorios: 135
    fonte: "TEXTOS_E_TEMPLATES.md §2.2 — 136 relatórios (72,3%), golden subtraído"

  s1_reuniao_negativa:
    classe: TPL
    template: >-
      Durante o período, não foram realizadas reuniões de alinhamento entre o Programa
      e a empresa executora {executora} no canteiro de obras da Rodovia {rodovia}.
    confirmado_em_relatorios: null
    fonte: "GUIA_DE_REDACAO.md §4.1 — forma condicional negativa; não quantificada isoladamente no corpus"

  s1_reuniao_positiva:
    classe: TPL
    template: >-
      Durante o período, foi realizada reunião de alinhamento entre o Programa e a empresa
      executora {executora} no canteiro de obras da Rodovia {rodovia}, em {data}, cuja
